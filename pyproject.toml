[build-system]
requires = ["setuptools>=77.0.3"]  # 77 reads the SPDX license expression below
build-backend = "setuptools.build_meta"

[project]
name = "ratio"
version = "0.1.0"
description = "Ratio: offline fair-trial monitoring analysis (FairTrial AI Hackathon, Track 2 prototype)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "Komal Neupane" },
  { name = "Sahil Kharel" },
  { name = "Hardik Kafle" },
  { name = "Emeric Chang" },
]
# Direct dependencies, pinned. The full transitive lock is requirements-lock.txt.
dependencies = [
  "sentence-transformers==6.1.0",
  "datasketch==2.0.0",
  "dateparser==1.4.3",
  "rapidfuzz==3.14.6",
  "unidecode==1.4.0",
  "pydantic==2.14.0",
  "streamlit==1.65.0",
  "pyyaml==6.0.3",
  "pypdf==6.19.0",
  "numpy==2.4.6",
  "opensearch-py==3.2.0",  # Similar cases: the optional vector index on 127.0.0.1
]

[project.optional-dependencies]
pdf = ["reportlab==4.4.9"]  # maintainer-only case reading sheets; runtime serves verified saved PDFs

dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]
# The precedent corpus builder only (python -m corpus_builder, run online by a maintainer). The Ratio
# app never installs or imports it: only public documents are ever sent to the cloud model.
corpus = [
  "google-genai==2.29.0",
  "httpx==0.28.1",  # Groq public-source maintainer worker
]
demo = ["httpx==0.28.1", "reportlab==4.4.9"]  # explicitly enabled public-source Groq demo

[tool.setuptools.packages.find]
include = ["ratio*", "corpus_builder*"]

[tool.setuptools.package-data]
ratio = ["config/*.yaml", "config/*.json"]
corpus_builder = ["sources.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "app"]
addopts = "-m 'not live' --strict-markers"
markers = [
  "embed: needs the local MiniLM model in models/ (run scripts/fetch_models.py once)",
  "live: needs a running local Ollama server with RATIO_MODEL pulled",
  "opensearch: needs OpenSearch on http://127.0.0.1:9200 (docker compose up -d opensearch); skipped when it is not running",
]

[tool.coverage.run]
source = ["ratio"]
omit = ["ratio/__main__.py"]
