# SYNTHETIC: fictional case; all people, courts, country, language and laws are invented.
#
# Gold annotations for the demo case, written by hand. `python -m ratio.gold` turns this file into:
#   mock_record.json     the record an ideal extractor would produce (modules are built against it)
#   expected_flags.json  what the eval expects the modules to find, and must not find
#   gold_timeline.json   the hand-checked dates for the date-accuracy metric
# Every quote must occur exactly once in its document (paths are relative to data/demo/case).
synthetic: true
case_id: venn-2025

# Events an ideal extractor returns (hearing events come from note headers, not the model).
events:
  - {id: arrest_indictment, type: arrest, doc: indictment.txt, quote: "The accused was arrested at his home in Mirevo in the early morning of 14 February 2025", date_text: "14 February 2025", date: 2025-02-14, precision: date}
  - {id: arrest_judgment, type: arrest, doc: judgment.txt, quote: "The accused was arrested on 14 February 2025", date_text: "14 February 2025", date: 2025-02-14, precision: date}
  - {id: arrest_note, type: arrest, doc: notes/hearing_1.txt, quote: "Mr. Venn had been arrested at his home before dawn on 14 February 2025", date_text: "14 February 2025", date: 2025-02-14, precision: date}
  - {id: first_appearance_indictment, type: first_appearance, doc: indictment.txt, quote: "On 19 February 2025 the accused was brought before Judge Ilena Varda of the Mirevo District Court", date_text: "19 February 2025", date: 2025-02-19, precision: date}
  - {id: first_appearance_judgment, type: first_appearance, doc: judgment.txt, quote: "was brought before this Court on 19 February 2025", date_text: "19 February 2025", date: 2025-02-19, precision: date}
  - {id: counsel_access_note, type: counsel_access, doc: notes/hearing_1.txt, quote: "she was first able to meet Mr. Venn on 21 February 2025", date_text: "21 February 2025", date: 2025-02-21, precision: date}
  - {id: charge_indictment, type: charge, doc: indictment.txt, quote: "On 3 March 2025 the Public Prosecutor filed this indictment", date_text: "3 March 2025", date: 2025-03-03, precision: date}
  - {id: charge_judgment, type: charge, doc: judgment.txt, quote: "The indictment was filed on 3 March 2025", date_text: "3 March 2025", date: 2025-03-03, precision: date}
  - {id: extension_1, type: detention_extension, doc: judgment.txt, quote: "His detention was extended on 19 March 2025", date_text: "19 March 2025", date: 2025-03-19, precision: date}
  - {id: extension_2, type: detention_extension, doc: judgment.txt, quote: "and again on 14 May 2025", date_text: "14 May 2025", date: 2025-05-14, precision: date}
  - {id: trial_start_note, type: trial_start, doc: notes/hearing_1.txt, quote: "The trial opened on 2 June 2025 at 10:05", date_text: "2 June 2025 at 10:05", date: 2025-06-02, precision: datetime}
  - {id: trial_start_judgment, type: trial_start, doc: judgment.txt, quote: "The trial opened on 2 June 2025", date_text: "2 June 2025", date: 2025-06-02, precision: date}
  - {id: verdict_note, type: verdict, doc: notes/hearing_4.txt, quote: "The presiding judge delivered the verdict on 14 July 2025", date_text: "14 July 2025", date: 2025-07-14, precision: date}
  - {id: verdict_judgment, type: verdict, doc: judgment.txt, quote: "Delivered on 14 July 2025", date_text: "14 July 2025", date: 2025-07-14, precision: date}

arguments:
  - {id: defence_warrant, party: defense, doc: notes/hearing_2.txt, quote: "Defence counsel argued that the messages presented by the prosecution had been extracted from Mr. Venn's mobile telephone"}
  - {id: prosecution_seizure, party: prosecution, doc: notes/hearing_2.txt, quote: "The prosecutor replied that the seizure was lawful"}
  - {id: defence_retroactivity, party: defense, doc: notes/hearing_3.txt, quote: "Defence counsel argued that the first article was published before the amendment to Article 214 entered into force"}

# What the modules must find. The status of every guarantee is pinned, not only the planted one.
expected:
  - {id: a_status, module: absence, standard_id: iccpr_14_3_a, kind: status, status: no_evidence, note: "The charge was read out, but no note records the language it was given in."}
  - {id: b_status, module: absence, standard_id: iccpr_14_3_b, kind: status, status: evidence_of_violation, anchors: [{doc: notes/hearing_1.txt, quote: "she had received the 900-page case file only three days before this hearing"}]}
  - {id: c_status, module: absence, standard_id: iccpr_14_3_c, kind: status, status: no_evidence}
  - {id: d_status, module: absence, standard_id: iccpr_14_3_d, kind: status, status: evidence_of_compliance, anchors: [{doc: notes/hearing_1.txt, quote: "Mr. Venn was present in the courtroom throughout the hearing"}]}
  - {id: e_status, module: absence, standard_id: iccpr_14_3_e, kind: status, status: evidence_of_violation, anchors: [{doc: notes/hearing_3.txt, quote: "The presiding judge refused to hear them, without giving reasons."}]}
  - {id: f_status, module: absence, standard_id: iccpr_14_3_f, kind: status, status: no_evidence, note: "Planted: no note mentions an interpreter."}
  - {id: g_status, module: absence, standard_id: iccpr_14_3_g, kind: status, status: evidence_of_compliance, anchors: [{doc: notes/hearing_1.txt, quote: "The presiding judge informed Mr. Venn that he had the right to remain silent."}]}
  - {id: a_follow_up, module: absence, standard_id: iccpr_14_3_a, kind: follow_up, status: no_evidence, anchors: [{doc: notes/hearing_1.txt, quote: "Mr. Venn's first language is Ostric"}], note: "The language fact is also the context for the charge follow-up."}
  - {id: f_follow_up, module: absence, standard_id: iccpr_14_3_f, kind: follow_up, status: no_evidence, anchors: [{doc: notes/hearing_1.txt, quote: "Mr. Venn's first language is Ostric"}], note: "Planted: the defendant's first language is a minority language; the follow-up shows it as context."}
  - {id: gc35_first_appearance, module: clock, standard_id: gc35_48h, kind: flag, status: exceeds_benchmark, match: any, anchors: [{doc: indictment.txt, quote: "in the early morning of 14 February 2025"}, {doc: indictment.txt, quote: "On 19 February 2025 the accused was brought before Judge Ilena Varda"}], note: "Planted: first appearance before a judge 5 days after arrest."}
  - {id: reuse_articles, module: reuse, standard_id: reasoning_reuse, kind: flag, status: verbatim_reuse, anchors: [{doc: judgment.txt, quote: "the accused published a series of articles on the news portal Mirevo Today"}]}
  - {id: reuse_alarm, module: reuse, standard_id: reasoning_reuse, kind: flag, status: verbatim_reuse, anchors: [{doc: judgment.txt, quote: "The articles were shared more than 40,000 times within three days"}]}
  - {id: reuse_knowledge, module: reuse, standard_id: reasoning_reuse, kind: flag, status: verbatim_reuse, anchors: [{doc: judgment.txt, quote: "The accused knew that the allegations were false, because the Ministry"}]}
  - {id: reuse_intent, module: reuse, standard_id: reasoning_reuse, kind: flag, status: verbatim_reuse, anchors: [{doc: judgment.txt, quote: "The Court finds that the conduct of the accused was deliberate"}]}
  - {id: reuse_paraphrase, module: reuse, standard_id: reasoning_reuse, kind: flag, status: paraphrase_reuse, anchors: [{doc: judgment.txt, quote: "Messages retrieved from the telephone of the accused demonstrate"}], note: "Planted: a light paraphrase of the indictment's statement on the messages."}
  - {id: unaddressed_warrant, module: reuse, standard_id: unaddressed_defense_argument, kind: flag, status: unaddressed_argument, anchors: [{doc: notes/hearing_2.txt, quote: "seized at his home on 14 February 2025 without a judicial warrant"}], note: "Planted: restated in the submissions section but never answered in the reasoning."}

# What the modules must not flag: legitimate quotation, the answered argument, and the prosecutor
# appearance that must not count as the first appearance before a judge (GC35 para 32).
must_not_flag:
  - {id: no_reuse_charge_recital, module: reuse, standard_id: reasoning_reuse, kind: flag, status: any, anchors: [{doc: judgment.txt, quote: "The accused is charged with disseminating false information"}]}
  - {id: no_reuse_statute_quote, module: reuse, standard_id: reasoning_reuse, kind: flag, status: any, anchors: [{doc: judgment.txt, quote: "Whoever disseminates information that he knows to be false"}]}
  - {id: no_reuse_prosecution_position, module: reuse, standard_id: reasoning_reuse, kind: flag, status: any, anchors: [{doc: judgment.txt, quote: "The prosecution argues that the accused knew that the allegations were false"}]}
  - {id: no_reuse_caption, module: reuse, standard_id: reasoning_reuse, kind: flag, status: any, anchors: [{doc: judgment.txt, quote: "The Republic of Calderra v. Daro Venn"}]}
  - {id: no_reuse_independent_reasoning, module: reuse, standard_id: reasoning_reuse, kind: flag, status: any, anchors: [{doc: judgment.txt, quote: "The Court has examined the testimony of the two officials"}]}
  - {id: no_unaddressed_retroactivity, module: reuse, standard_id: unaddressed_defense_argument, kind: flag, status: unaddressed_argument, anchors: [{doc: notes/hearing_3.txt, quote: "the first article was published before the amendment to Article 214 entered into force"}]}
  - {id: no_prosecutor_as_first_appearance, module: clock, standard_id: gc35_48h, kind: event, status: first_appearance, anchors: [{doc: indictment.txt, quote: "On 15 February 2025 the accused was brought before the Public Prosecutor"}]}
