#
# Seed matrix for the Judicial History Tracker demo. `python scripts/build_history.py` writes one
# folder per case (summary.txt, case.yaml, rulings.yaml) plus README.md.
#
# Designed outcome on the profile of Judge Ilena Varda (8 cases here + the demo case = 9 cases),
# compared with the other judges of the same court and charge type (10 cases):
#   pretrial detention at first appearance  9/9 vs 4/10  -> "pattern that warrants review"
#   conviction at first instance            8/9 vs 7/10  -> shown, not distinguishable
#   hearing closed to the public            5/9 vs 2/10  -> shown, not distinguishable
#   contested evidence admitted             3 cases      -> hidden (fewer than 5)
#   every defence motion denied             4 cases      -> hidden (fewer than 5)
# Registry safeguards: one case names the judge only by initials (manual confirmation list), and
# a judge with the same name sits at another court (never merged).
