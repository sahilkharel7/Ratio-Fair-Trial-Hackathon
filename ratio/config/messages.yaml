# The messages of Ratio's findings, and the short status and evidence labels shown next to them,
# come from these templates, so that wording can be reviewed in one place. Hard rule 3: no verdicts about people. Templates describe what the record shows and leave
# conclusions to the reviewing lawyer.
version: 1

templates:
  absence_violation: "The notes describe facts contrary to {provision} ({name}). Review the linked notes."
  absence_compliance: "The notes contain evidence of compliance with {provision} ({name})."
  absence_follow_up: "No evidence in the notes for {provision} ({name}). Follow-up for the monitor: {question}"
  clock_exceeds: "{from_label} to {to_label}: {duration}, longer than the {threshold} benchmark. {citation_note}"
  clock_needs_review: "{from_label} to {to_label}: {duration}. The dates need review before this interval is compared with the {threshold} benchmark."
  clock_measured: "{from_label} to {to_label}: {duration}. No confirmed threshold; measured and shown only."
  reuse_verbatim: "This passage of the judgment's reasoning closely matches indictment text ({percent}% of its {n}-word sequences appear in the indictment)."
  reuse_paraphrase: "This passage of the judgment's reasoning closely paraphrases indictment text (similarity {similarity})."
  reuse_charge_wording: "This passage of the judgment's reasoning repeats the indictment's wording of the charge ({percent}% of its {n}-word sequences). A court states the charge it rules on, so this is shown but not counted in the score."
  reuse_unaddressed: "No response to this defense argument was found in the judgment's reasoning ({count} of {total} passages checked). Whether it was decisive is for the reviewing lawyer."
  reuse_unaddressed_no_reasoning: "The judgment contains no passages of the court's own reasoning, so no response to this defense argument was found. Whether it was decisive is for the reviewing lawyer."
  renewal_repeated: "{percent}% of this order's grounds repeat earlier orders in the case ({sources}); {new} of its {compared} grounds passages long enough to compare are new. Whether detention was re-examined is for the reviewing lawyer."
  renewal_gap: "The order of {earlier} authorised detention until {until}; the next order in the record is dated {next}. Whole days with no order in the record: {days}. Whether another order covered them is for the reviewing lawyer."
  judge_pattern: "Pattern that warrants review: {label} ({judge_rate}, n={judge_n} cases) differs from the baseline for the same court and charge type ({baseline_rate}, n={baseline_n} cases); indicators compared on this page: {k}."
  judge_not_distinguishable: "Not distinguishable from the baseline at this sample size ({judge_n} cases, against {baseline_n} cases in the baseline)."
  judge_hidden: "Not shown: fewer than {min} cases ({n})."
  judge_hidden_baseline: "Not shown: the baseline has fewer than {min} cases ({n})."
  manual_confirmation: "These names may belong to a registered judge, or have no personal name to match. Until a person records a decision in {file}, their rulings count nowhere: not in a judge's rates and not in any baseline."
  judge_descriptive: "Shown as numbers only ({cases} cases): sentences depend on the offence and the facts, so they are never compared with a baseline."
  judge_method: "Each case counts once per indicator. The first appearance and the verdict are decided by one ruling of the case, and the case counts for the judge who made it; the other indicators use this judge's own coded rulings in the case. The baseline is every other judge of the same court for the same charge type, with no wider pool. Rates show {confidence} Wilson intervals. The pattern label needs a Newcombe interval for the difference that excludes zero at 1 - {alpha}/k, where k is the number of indicators compared on this page. Indicators with fewer than {minimum} cases, for the judge or the baseline, are not shown. Names waiting for confirmation, and cases whose rulings cannot be put in order, count nowhere."
  review_status: "Reviewed: {reviewed} of {total} findings ({accepted} accepted, {edited} reworded, {rejected} rejected). Issues recorded that Ratio did not flag: {missed}."
  review_stale: "Earlier decisions on findings this analysis no longer produces: {n}. They are kept for the record and listed on the Review page."

notes:
  selection_bias: "TrialWatch monitors cases already suspected of unfairness, so these rates are not representative. The baseline is also drawn from monitored cases. Indicators are prompts for review; conclusions on impartiality are for the reviewing lawyer."
  synthetic_banner: "SYNTHETIC DATA: fictional case. All people, courts, country, language and laws are invented."
  not_attributed: "Case-level outputs from other modules (not attributed to the judge)"
  needs_legal_review: "Needs legal review"
  model_note_label: "Model note (unverified)"
  # The report draft export (ratio/report.py): its title, disclaimer and section headings.
  report_title: "Report draft"
  report_disclaimer: "Draft for the reviewing lawyer, generated by Ratio. Each finding is numbered (F1, F2, ...) and its source text is quoted word for word in the annex, with the document and line it comes from. The findings describe what the record shows; the legal evaluation is for the reviewing lawyer. Wording marked as needing legal review has not been confirmed."
  report_coverage: "Rights coverage (ICCPR Art. 14(3))"
  report_timeline: "Procedural timeline"
  report_reuse: "Reasoning reuse"
  report_renewal: "Detention renewals"
  renewal_intro: "Each detention order is compared with the orders before it: the share of its grounds that repeats them, word for word or as a close paraphrase, and the days between one order's end date and the next order. Quoted law, the prosecutor's request and the operative part are left out. Repetition shows where to look; whether detention was properly re-examined is for the reviewing lawyer."
  report_judge: "Judicial pattern indicators"
  report_annex: "Annex: source text of each finding"
  report_missed: "Issues recorded by the reviewer that Ratio did not flag"
  report_reviewer_wording: "Reviewer's wording"
  report_ratio_wording: "Ratio's wording"
  review_intro: "Accept a finding, reword it, or reject it with a reason, and record any issue Ratio did not flag. Decisions are saved on this computer, appear in the report draft, and show where Ratio needs improving. The evaluation is the reviewer's, not Ratio's."
  jurisprudence_heading: "Related jurisprudence to check"
  jurisprudence_caveat: "Chosen by the standard this concerns, not by the facts of the case: whether it applies is for the reviewing lawyer. General Comment paragraphs are quoted in their own words; a Committee decision is cited only for what the General Comment cites it for."
  jurisprudence_intro: "Paragraphs of the Human Rights Committee's General Comments 32 and 35, and the Committee decisions they cite, linked to each finding by the standard it concerns. Every quote and citation was checked against the official UN documents. Nothing here says that an entry applies to this case."
  steelman_heading: "The State's strongest reply (model-generated, unverified)"
  steelman_caveat: "Written by the local model to test the finding, from the record passages most similar to it. Each argument rests on a ground drafted by the team (it needs legal review) and on an exact quote of the record; the wording is the model's and has not been verified. It is not Ratio's view and not a finding."
  steelman_unsupported: "Grounds the passages shown to the model did not support"
  steelman_intro: "For each finding the State would contest, the strongest reply the State could make, argued by the local model from the record so that the reviewing lawyer can test the finding before relying on it. Judge patterns get no reply: arguing a judge's side would be a statement about a person."
  report_no_judge: "No coded rulings are stored for the presiding judge of this case, so there are no indicators to report."

