# Analysis settings. These are engineering heuristics (similarity thresholds, chunk sizes), not
# legal thresholds; legal benchmarks live in benchmarks.yaml.
version: 1

llm:
  default_model: "qwen2.5:7b-instruct"  # overridden by the RATIO_MODEL environment variable
  host: "http://127.0.0.1:11434"  # loopback only; the client refuses anything else
  num_ctx: 8192  # fixed for every call (changing it reloads the model; the default 4096 truncates silently)
  temperature: 0
  seed: 42
  timeout_seconds: 90
  keep_alive: "30m"
  num_predict:
    extraction: 1500
    labels: 3000
    argument_check: 400

extraction:
  chunk_chars: 2500
  chunk_overlap_chars: 200
  min_quote_chars: 12  # shorter model quotes are dropped (they match too many places)
  fuzzy_min_quote_chars: 30  # fuzzy matching only for long quotes whose digits match exactly
  fuzzy_threshold: 90
  # A note sentence is kept as a party argument only if it contains one of these verbs; this
  # drops announcements, reminders and requests that a small model sometimes labels as arguments.
  argument_markers:
    - "argued"
    - "argues"
    - "contended"
    - "contends"
    - "submitted that"
    - "submits that"
    - "maintained that"
    - "maintains that"
    - "objected"
    - "challenged"
    - "insisted that"
    - "claimed that"
    - "asserted that"

embeddings:
  model_dir: "models/all-MiniLM-L6-v2"

absence:
  # Shortlists are built per rubric part: the top notes overall for case-level parts, and the
  # top notes of every monitored hearing for per-hearing parts (so no hearing is skipped).
  # Notes containing one of a part's keywords (rubric.yaml) are always included. Above
  # max_shortlist, keyword notes and each hearing's best note are kept first; the model labels
  # the shortlist in batches that fit its context window.
  shortlist_top_k: 6
  per_hearing_top_k: 4
  max_shortlist: 60
  shortlist_min_similarity: 0.15
  # The note most similar to a rubric context indicator (e.g. the defendant's language) is shown
  # next to a follow-up question as possibly relevant; it never counts as evidence.
  context_min_similarity: 0.35

reuse:
  shingle_size: 5  # word 5-grams
  minhash_num_perm: 128
  minhash_seed: 1
  # MinHash LSH (tuned for recall) proposes near-copies of indictment passages, confirmed by exact
  # Jaccard; an exact 5-gram index measures containment against the whole indictment, so a
  # sentence stitched from two indictment sentences, or excerpted from a long one, is caught too.
  lsh_threshold: 0.3
  lsh_weights: [0.1, 0.9]  # (false positive, false negative) weights: missing a copy costs more
  verbatim_jaccard: 0.5
  verbatim_containment: 0.6  # share of the judgment passage's 5-grams found in the indictment
  min_source_share: 0.1  # an indictment passage counts as a source when it supplies this share of the 5-grams
  paraphrase_cosine: 0.7  # planted paraphrase measures 0.756 with MiniLM; best reasoning hard negative 0.523
  paraphrase_min_shared_words: 3
  min_passage_words: 6  # shorter passages count as reasoning but are never matched
  # Defence arguments are checked against every reasoning passage, or the most similar ones when
  # the reasoning is longer than this (the prompt must fit the model's context window).
  argument_max_passages: 40
  # What counts as the court's own reasoning. All patterns are regular expressions matched
  # case-insensitively on the sentence with its whitespace collapsed (line breaks never hide a
  # match). They are engineering heuristics for English-language judgments.
  #
  # Chapters that are not reasoning: a chapter title counts when it starts with one of these
  # (after "the"); a title that goes on to name the court's assessment, findings or reasons
  # stays reasoning ("Submissions of the parties and assessment of the court").
  non_reasoning_headings:
    - "procedural history"
    - "charges?"
    - "indictment"
    - "submissions"
    - "arguments of the parties"
    - "parties' (?:arguments|positions|submissions)"
    - "positions of the parties"
    - "case for the (?:prosecution|defen[cs]e)"
    - "(?:prosecution|defen[cs]e) case"
    - "disposition"
    - "operative (?:part|provisions)"
    - "for these reasons"
    - "on these grounds"
    - "verdict"
    - "decision"
  reasoning_heading_words:
    - "assessment"
    - "findings?"
    - "analysis"
    - "merits"
    - "reasons"
    - "reasoning"
    - "considerations"
    - "court's"
    - "deliberations?"
  recital_markers:
    - "(?:is|was|were|are|has been|had been|stands|stood) charged with"
    - "(?:is|was|stands) accused of"
    - "according to the indictment"
    - "the indictment (?:of [^,.]{0,40} )?(?:alleges|charges|states|accuses|reads)"
    - "charged (?:\\w+ ){0,4}(?:under|in|on) count \\d+"
    - "count \\d+ of the indictment"
  # A statute quotation needs one of these markers plus a quotation mark or a citation. When the
  # marker sentence ends with ":" or "as follows", the next paragraph is the quoted text.
  statute_markers:
    - "provides:"
    - "provides that"
    - "reads:"
    - "reads as follows"
    - "is worded as follows"
    - "states:"
    - "stipulates"
    - "prescribes"
    - "lays down that"
  party_terms:
    - "the prosecution"
    - "the (?:public |state |district |chief )?prosecutor(?:'s office)?"
    - "prosecution counsel"
    - "the crown"
    - "the defen[cs]e"
    - "defen[cs]e counsel"
    - "counsel for the (?:accused|defen[cs]e|prosecution)"
  # "<party> <verb>" only counts when the party opens the sentence (after a connective such as
  # "However,"); "Contrary to what the defence argues, ..." is the court speaking. A party term
  # followed by one of these nouns is someone else ("the defence witness claimed").
  not_a_party_after:
    - "witness(?:es)?"
    - "experts?"
    - "investigators?"
    - "officers?"
    - "exhibits?"
    - "evidence"
  sentence_openers:
    - "however"
    - "further(?:more)?"
    - "moreover"
    - "in addition"
    - "additionally"
    - "finally"
    - "also"
    - "first(?:ly)?"
    - "second(?:ly)?"
    - "third(?:ly)?"
    - "lastly"
    - "in particular"
    - "similarly"
    - "likewise"
    - "in reply"
    - "in response"
  attribution_verbs:  # explicit forms: the bare nouns "claim" and "request" are not reporting verbs
    - "argues"
    - "argued"
    - "submits"
    - "submitted"
    - "contends"
    - "contended"
    - "alleges"
    - "alleged"
    - "claims that"
    - "claimed"
    - "maintains"
    - "maintained"
    - "asserts"
    - "asserted"
    - "requests that"
    - "requested"
    - "states"
    - "stated"
    - "points out"
    - "pointed out"
    - "relies on"
    - "relied on"
    - "objects"
    - "objected"
    - "insists"
    - "insisted"
    - "complains"
    - "complained"
    - "disputes"
    - "disputed"
    - "suggests"
    - "suggested"
    - "accepts that"
    - "accepted that"
    - "concedes"
    - "conceded"
    - "acknowledges"
    - "acknowledged"
  attribution_prefixes:
    - "according to"
    - "in the view of"
    - "in the submission of"
    - "in the opinion of"
  attribution_possessives:  # "The prosecution's case is that ..."
    - "view"
    - "case"
    - "position"
    - "submissions?"
    - "arguments?"
    - "contention"
  endorsement_words:  # "The defence rightly argues ..." is the court adopting the argument
    - "rightly"
    - "correctly"
    - "justifiably"
    - "convincingly"
  court_voice_markers:
    - "(?:the|this) (?:(?:trial|appeals?|district|high|supreme) )?(?:court|chamber|tribunal|panel|bench)(?: ?,[^,]{1,80},)? (?:(?:therefore|thus|also|further|accordingly|nevertheless|however|consequently|hence|equally|firmly) )?(?:finds|found|considers|considered|notes|noted|observes|observed|holds|held|concludes|concluded|accepts|accepted|rejects|rejected|agrees|agreed|dismisses|dismissed|shares the view|adopts|(?:is|was) (?:not )?(?:satisfied|persuaded|convinced)|(?:is|was) of the view|has (?:examined|considered|reviewed|assessed|taken)|does not (?:accept|agree|find|consider)|cannot (?:accept|agree)|sees no)"
    - "\\b(?:we|i) (?:find|hold|consider|conclude|accept|reject|agree)\\b"
    - "(?:this|that|the|such an?) (?:argument|objection|submission|contention|request|claim|complaint|plea) (?:is|was|must be|cannot|can not|fails?|failed|has no|lacks?|does not)"
    - "in the (?:court|chamber|tribunal)'s (?:view|opinion|assessment)"

judges:
  min_case_count: 5  # an indicator is hidden if the judge or the baseline has fewer cases
  alpha: 0.05  # 95% intervals for each rate; for the pattern test it is split across the k indicators shown (Bonferroni)
  # Names are transliterated (unidecode), lower-cased and stripped of leading titles, then compared
  # with rapidfuzz token_sort_ratio, only within the same court. At or above the threshold they are
  # one judge; between the floor and the threshold, or written with initials only, they go to the
  # manual confirmation list and count nowhere until a person decides (alias_decisions.yaml).
  name_match_threshold: 92
  ambiguous_floor: 75
  date_tolerance_days: 1825  # heuristic: a name seen at the same court more than 5 years apart needs confirmation
  title_words: [judge, justice, the, hon, honourable, honorable, mr, mrs, ms, miss, dr, presiding, his, her, honour, honor, lord, lady, sir, dame, madam, magistrate, chief]

ui:
  context_chars: 600
