dataframeHeaderTextColor = "#0F172A"
codeTextColor = "#0F172A"
codeBackgroundColor = "#F1F5F9"
redColor = "#B91C1C"
redBackgroundColor = "#FEE2E2"
redTextColor = "#991B1B"
orangeColor = "#C2410C"
orangeBackgroundColor = "#FFEDD5"
orangeTextColor = "#9A3412"
yellowColor = "#A16207"
yellowBackgroundColor = "#FEF9C3"
yellowTextColor = "#854D0E"
greenColor = "#15803D"
