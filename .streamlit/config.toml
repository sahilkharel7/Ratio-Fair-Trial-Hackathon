# Ratio runs fully offline on localhost. app/main.py refuses to start if these privacy settings are not in effect.
# The same file is in .streamlit/ (read when Streamlit starts in the repo root, and by the tests) and in
# app/.streamlit/ (read from any working directory, with the highest precedence of the config files).
# tests/test_privacy_config.py keeps the two identical. Command-line flags and STREAMLIT_* environment
# variables override both: do not pass any that change these settings.

[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
port = 8501
headless = true
showEmailPrompt = false
fileWatcherType = "none"
maxUploadSize = 20

[client]
toolbarMode = "viewer"
showErrorDetails = "stacktrace"
showErrorLinks = false

[theme]
base = "light"  # set here, so a theme file named by URL in another config is never fetched
# The fonts bundled with Streamlit, set here for every theme section, so a font from a global
# config (which could name a web address) can never be fetched by the browser. Headings use the
# bundled serif, as legal documents do; body text the bundled sans.
font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"
fontFaces = []
headingFontSizes = ["2.1rem", "1.55rem", "1.25rem", "1.1rem", "1rem", "0.9rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "small"
buttonRadius = "small"
linkUnderline = true  # links are not told apart by colour alone
showWidgetBorder = true

[theme.sidebar]
font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"

# Colours: ink and slate with a navy accent. Red is reserved for evidence of violation and the
# confirmed benchmark that is exceeded. Every text colour meets WCAG AA (4.5:1) on its background,
# in the light and the dark theme (the browser's setting picks one).
[theme.light]
font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"
