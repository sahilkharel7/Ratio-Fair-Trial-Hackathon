# Ratio runs fully offline on localhost. app/main.py refuses to start if these privacy settings are not in effect.
# The same file is in .streamlit/ (read when Streamlit starts in the repo root, and by the tests) and in
# app/.streamlit/ (read from any working directory, with the highest precedence of the config files).
# tests/test_privacy_config.py keeps the two identical. Command-line flags and STREAMLIT_* environment
# variables override both: do not pass any that change these settings.

[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
port = 8501
headless = true
showEmailPrompt = false
fileWatcherType = "none"
maxUploadSize = 20

[client]
toolbarMode = "viewer"
showErrorDetails = "stacktrace"
showErrorLinks = false

[theme]
base = "light"  # set here, so a theme file named by URL in another config is never fetched
# A calm accent: red is reserved for the one confirmed benchmark that is exceeded.
primaryColor = "#2f6fb0"
# The fonts bundled with Streamlit, set here for every theme section, so a font from a global
# config (which could name a web address) can never be fetched by the browser.
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
fontFaces = []

[theme.sidebar]
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"

[theme.light]
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"

[theme.light.sidebar]
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"

[theme.dark]
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"

[theme.dark.sidebar]
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
