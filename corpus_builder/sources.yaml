  - id: ccpr_views
    kind: ccpr_views
    name: "Views of the UN Human Rights Committee (ccprcentre.org)"
    body: "UN Human Rights Committee"
    attribution: "Views adopted by the UN Human Rights Committee under the Optional Protocol to the ICCPR (United Nations documents); copies hosted by the Centre for Civil and Political Rights (ccprcentre.org)."
    # TODO: verify reuse. The site links no terms page (checked 2026-10-09). The Views are UN documents:
    # download them by hand from the UN (local_files) if reuse is unclear.
    terms_url: https://ccprcentre.org/
    terms_checked: 2026-10-09
    terms_summary: "No terms-of-use link in the footer, which reads \"© 2008-2026. All Rights Reserved Centre for Civil and Political Rights (CCPR Centre)\". The case digests are CCPR Centre content (all rights reserved); the underlying Views are UN documents."
    # ccprcentre.org robots.txt (2026-10-09): Crawl-delay: 10, nothing disallowed. Its full texts under
    # /files/decisions/ redirect (302) to cdn.ccprcentre.org. On 2026-10-09
    # https://cdn.ccprcentre.org/robots.txt answered 404 (no robots.txt, so no restrictions) and a
    # decision PDF there answered 200 application/pdf. The fetcher reads each host's robots.txt again at
    # fetch time, redirect targets included, and obeys what it finds then.
    allowed_prefixes: ["https://ccprcentre.org/", "https://cdn.ccprcentre.org/"]
    min_interval_s: 10
    # Only the Views' full text: the UN's own document, as a PDF under /files/decisions/. Never a
    # ccprcentre.org/decision/<n> page: that page is the CCPR Centre's own digest of the case (its
    # summary and commentary, "All Rights Reserved"), not the UN text. So the cases whose English full
    # text is not such a PDF are left out (Kovsh (Abramova), Marques de Morais, Bodrozic, Njaru
    # (Afuson), Esergepov (a .docx), Cacho Ribeiro (Spanish only), Djakupova and Idinov, Bokayev and
    # Ayanov): to add one, download its Views by hand from the UN and list it under local_files. A
    # "decision page" comment below only notes where the PDF is linked from; it is never fetched.
    seeds:
      - url: https://ccprcentre.org/files/decisions/277_1988_Jijon_v__Ecuador1.pdf
        # decision page: https://ccprcentre.org/decision/16315
        symbol: CCPR/C/44/D/277/1988
        title: "Teran Jijon v. Ecuador"
        state: Ecuador
        year: 1992
      - url: https://ccprcentre.org/files/decisions/458_1991_Mukong_v__Cameroon.pdf
        # decision page: https://ccprcentre.org/decision/16236
        symbol: CCPR/C/51/D/458/1991
        title: "Mukong v. Cameroon"
        state: Cameroon
        year: 1994
      - url: https://ccprcentre.org/files/decisions/G1813926.pdf
        # decision page: https://ccprcentre.org/decision/16860
        symbol: CCPR/C/122/D/2252/2013
        title: "Khadzhiyev and Muradova v. Turkmenistan"
        state: Turkmenistan
        year: 2018
      - url: https://ccprcentre.org/files/decisions/G1813304.pdf
        # decision page: https://ccprcentre.org/decision/16857
        symbol: CCPR/C/122/D/2212/2012
        title: "Sannikov v. Belarus"
        state: Belarus
        year: 2018
      - url: https://ccprcentre.org/files/decisions/G2032783.pdf
        # decision page: https://ccprcentre.org/decision/17116
        symbol: CCPR/C/129/D/2535/2015
        title: "Lukpan Akhmedyarov v. Kazakhstan"
        state: Kazakhstan
        year: 2020
      - url: https://ccprcentre.org/files/decisions/G2325912_(1).pdf
        # decision page: https://ccprcentre.org/decision/17564
        symbol: CCPR/C/139/D/3252/2018
        title: "Dina Maslova v. Kyrgyzstan"
        state: Kyrgyzstan
        year: 2023
      - url: https://ccprcentre.org/files/decisions/G2516750_(1).pdf
        # decision page: https://ccprcentre.org/decision/17726
        symbol: CCPR/C/144/D/3053/2017
        title: "Lopez Mendoza and Tintori Parra v. Venezuela"
        state: Venezuela
        year: 2025
