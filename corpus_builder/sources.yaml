# Public sources of the precedent corpus ("Similar cases"), read by corpus_builder/sources.py.
#
# Only these addresses are fetched: each source's seeds and, for a source with a sitemap, the
# sitemap pages whose address matches url_pattern. A link found in a page is never followed.
# robots.txt is obeyed, and each host gets at most one request every min_interval_s seconds (longer
# if its robots.txt sets a Crawl-delay). Every seed must start with one of allowed_prefixes.
#
# documents.un.org and docs.un.org cannot be prefixes: their robots.txt disallows /doc, /api and
# /access. A UN document from there is downloaded by hand into data/corpus/local/<source id>/ and
# listed under local_files (path, the url it came from, and what is known about it).
#
# Seed fields: url (required), symbol, title, state, year. Keep this schema stable: more seeds are
# added from verified research. Every seed below was checked once on 2026-10-09 (one HEAD or GET with
# the builder's user agent, obeying robots.txt and the delays) and answered 200, except the ccpr_views
# full texts, which redirect to cdn.ccprcentre.org (see that source).
version: 1

sources:
  - id: trialwatch_reports
    kind: trialwatch_report
    name: "TrialWatch reports (cfj.org)"
    body: "TrialWatch (Clooney Foundation for Justice)"
    attribution: "TrialWatch, an initiative of the Clooney Foundation for Justice (cfj.org). Reproduced as public reference material."
    # TODO: verify reuse with TrialWatch. cfj.org has no terms-of-use page (checked 2026-10-09): the footer
    # and page-sitemap.xml link only https://cfj.org/privacy-notice/, about personal data, so the home
    # page is cited.
    terms_url: https://cfj.org/
    terms_checked: 2026-10-09
    terms_summary: "No terms-of-use page exists: the footer (and page-sitemap.xml) links only a Privacy Notice about personal data, which says nothing on content reuse; the footer reads \"© 2026 Clooney Foundation For Justice.\" Treat the reports as copyrighted CFJ publications, publicly downloadable: cite and link, do not republish wholesale."
    allowed_prefixes: ["https://cfj.org/"]
    min_interval_s: 10  # robots.txt (2026-10-09): nothing disallowed, Crawl-delay: 10
    # Curated seeds, no sitemap: the sitemap lists each case's HTML page (/reports/<slug>/), which would
